[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hacettepe-stem-cell"
version = "1.2.0"
description = "Computational Stem Cell Biology, Epigenetic Dynamics, and Regenerative Medicine Suite"
readme = "README.md"
authors = [
    { name = "Bahattin Yunus Çetin", email = "bahattinyunuscetin@hotmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
]

[project.scripts]
hsc = "src.cli:main"
hacettepe-stem-cell = "src.cli:main"

[project.urls]
Homepage = "https://github.com/bahattinyunus/hacettepe-stem-cell"
Documentation = "https://github.com/bahattinyunus/hacettepe-stem-cell/tree/main/docs"
Repository = "https://github.com/bahattinyunus/hacettepe-stem-cell.git"
Issues = "https://github.com/bahattinyunus/hacettepe-stem-cell/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
