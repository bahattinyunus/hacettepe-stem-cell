[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hacettepe-stem-cell"
version = "1.0.0"
description = "Hacettepe Kök Hücre ve Rejeneratif Tıp Biyoinformatik ve Analiz Paketi"
readme = "README.md"
authors = [
    { name = "Bahattin Yunus Çetin", email = "bahattinyunuscetin@hotmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
hacettepe-stem-cell = "app.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

